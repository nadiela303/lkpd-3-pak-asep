<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Nadiela</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        background: #ffffff;
        margin: 0 auto;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      h2 {
        text-align: center;
        color: #333333;
      }
      .profile-img {
        text-align: center;
        margin-bottom: 20px;
      }
      .profile-img img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #007bff;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      table td {
        padding: 10px;
        vertical-align: top;
      }
      table td.label {
        font-weight: bold;
        width: 35%;
        color: #555555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Biodata Diri</h2>

      <div class="profile-img">
        <img src="https://via.placeholder.com/120" alt="Foto Profil Nadiela" />
      </div>

      <table>
        <tr>
          <td class="label">Nama Lengkap</td>
          <td>: Nadiela</td>
        </tr>
        <tr>
          <td class="label">Kelas</td>
          <td>: XI RPL 1</td>
        </tr>
        <tr>
          <td class="label">Tempat, Tanggal Lahir</td>
          <td>: Garut, 29 November 2009</td>
        </tr>
        <tr>
          <td class="label">Jenis Kelamin</td>
          <td>: Perempuan</td>
        </tr>
        <tr>
          <td class="label">Hobi</td>
          <td>: Rebahan, mendengarkan musik, dan makan</td>
        </tr>
      </table>
    </div>
  </body>
</html>
