<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Saya</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        background: rgba(255, 255, 255, 0.95);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        max-width: 450px;
        width: 100%;
      }
      h1 {
        color: #4a4e69;
        text-align: center;
        font-size: 24px;
        margin-bottom: 20px;
        border-bottom: 3px solid #ff758c;
        padding-bottom: 10px;
      }
      .info-item {
        background: #f8f9fa;
        margin-bottom: 10px;
        padding: 12px 15px;
        border-radius: 8px;
        font-size: 15px;
        color: #333;
        border-left: 5px solid #ff758c;
      }
      .info-item strong {
        color: #222;
        display: inline-block;
        width: 130px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Profil Siswa</h1>

      <div class="info-item"><strong>Nama Lengkap:</strong> Nadiela Muthiara Ulfa Hariyanto</div>
      <div class="info-item"><strong>Jenis Kelamin:</strong> Perempuan</div>
      <div class="info-item"><strong>TTL:</strong> Garut, 29 November 2009</div>
      <div class="info-item"><strong>Agama:</strong> Islam</div>
      <div class="info-item"><strong>Sekolah:</strong> SMKN 1 Garut</div>
      <div class="info-item"><strong>Hobi:</strong> Rebahan dan mendengarkan musik</div>
    </div>
  </body>
</html>
